<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>唐末风云</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: #F0E8D8; }
    #game-container { width: 100vw; height: 100vh; touch-action: none; }
    canvas { touch-action: none !important; }
    /* 横屏提示——小横幅，不遮挡游戏 */
    #rotate-hint {
      display: none;
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      z-index: 9999; cursor: pointer;
      background: rgba(247,242,232,0.96); border: 1px solid #D4C5A0;
      border-radius: 10px; padding: 12px 24px;
      color: #3D2B1F;
      font-family: 'Microsoft YaHei', SimHei, sans-serif;
      font-size: 15px; text-align: center;
      opacity: 0; transition: opacity 0.5s;
    }
    #rotate-hint.show { opacity: 1; }
    #rotate-hint svg { width: 28px; height: 28px; fill: #C43A30; vertical-align: middle; margin-right: 6px; }
    /* toast 弹出/消失动画 */
    @keyframes toastFade {
      0% { opacity:0; transform:translateX(-50%) translateY(20px); }
      15% { opacity:1; transform:translateX(-50%) translateY(0); }
      75% { opacity:1; transform:translateX(-50%) translateY(0); }
      100% { opacity:0; transform:translateX(-50%) translateY(-10px); }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-B2P3iTWA.js"></script>
</head>
<body>
  <!-- 竖屏时底部小横幅提示，3秒自动消失，不挡游戏 -->
  <div id="rotate-hint">
    <svg viewBox="0 0 24 24"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 19.29 0 13.97 0l-.19.01 3.17 3.17-1.47-0.66zm-6.25-.77c-.59.28-1.14.62-1.64 1.01L10.48 4.6c.38-.28.78-.52 1.2-.72L10.23 1.75zm1.5 18.56c-3.27-1.55-5.61-4.72-5.97-8.48H4.26C4.56 19.16 8.71 24 14.03 24l.19-.01-3.17-3.17 1.47.69zM3.02 4.77L1.75 6.04 0 4.29v6.19h6.19L4.35 8.64l1.27-1.27C6.57 6.02 7.83 5.18 9.27 4.7L7.39 2.83c-1.59.55-3.02 1.45-4.37 1.94z"/></svg>
    横屏体验更佳（点击关闭）
    <br><span style="font-size:12px;color:#6B5B4F;">如无法横屏，请关闭手机"旋转锁定"</span>
  </div>
  <div id="game-container"></div>
  <script>
    // 小横幅：竖屏时出现，点击关闭或横屏自动消失
    (function(){
      var hint = document.getElementById('rotate-hint');
      var dismissed = false;
      hint.addEventListener('click', function(){
        dismissed = true;
        hint.classList.remove('show');
        setTimeout(function(){ hint.style.display = 'none'; }, 500);
      });
      function check(){
        if (window.innerWidth > window.innerHeight) {
          // 已是横屏，隐藏
          hint.classList.remove('show');
          setTimeout(function(){ hint.style.display = 'none'; }, 500);
          return;
        }
        if (dismissed) return;
        hint.style.display = 'block';
        setTimeout(function(){ hint.classList.add('show'); }, 50);
      }
      var timer = 0;
      window.addEventListener('resize', function(){
        clearTimeout(timer);
        timer = setTimeout(check, 400);
      });
      window.addEventListener('orientationchange', function(){
        setTimeout(check, 600);
      });
      setTimeout(check, 800);
    })();
  </script>
</body>
</html>
